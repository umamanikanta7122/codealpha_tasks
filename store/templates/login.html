{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

   <style>
body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;

    background-image:url("{% static 'images/ecommerce-login-bg.jpg' %}");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:380px;
    padding:30px;

    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(12px);

    border-radius:15px;
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:white;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.register-link{
    text-align:center;
    margin-top:15px;
}

.register-link a{
    color:white;
    text-decoration:none;
}

.error{
    color:#ffcccc;
    text-align:center;
}
</style>
</head>

<body>

<div class="login-box">

    <h2>Login</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

    <div class="register-link">
        Don't have an account?
        <a href="/register/">Register</a>
    </div>

</div>

</body>
</html>
