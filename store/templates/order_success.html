<!DOCTYPE html>

<html>
<head>
    <title>Order Successful</title>


<style>

    body{
        background:#0f172a;
        font-family:Arial,sans-serif;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
    }

    .success-box{
        background:#1e293b;
        padding:50px;
        border-radius:20px;
        text-align:center;
        color:white;
        width:500px;
        box-shadow:0px 0px 25px rgba(0,255,204,0.2);
    }

    .icon{
        font-size:80px;
        margin-bottom:20px;
    }

    h1{
        color:#00ff88;
        margin-bottom:15px;
    }

    p{
        color:#cbd5e1;
        font-size:18px;
    }

    .home-btn{
        display:inline-block;
        margin-top:25px;
        background:#00ffcc;
        color:black;
        padding:15px 25px;
        text-decoration:none;
        border-radius:10px;
        font-weight:bold;
    }

    .home-btn:hover{
        transform:scale(1.05);
    }

</style>


</head>

<body>

<div class="success-box">


<div class="icon">🎉</div>

<h1>Order Placed Successfully!</h1>

<p>
    Thank you for shopping with TechVerse.
</p>

<p>
    Your order has been received and is being processed.
</p>

<a href="/" class="home-btn">
    Continue Shopping
</a>


</div>

</body>
</html>
