{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>

        .register-box{
            width:350px;
            margin:60px auto;
            background:#1e1e1e;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 15px rgba(0,255,204,0.2);
        }

        .register-box h2{
            text-align:center;
            color:#00ffcc;
            margin-bottom:20px;
        }

        .register-box input{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:20px;
            border:none;
            border-radius:8px;
            background:#2c2c2c;
            color:white;
        }

        .register-box button{
            width:100%;
        }

        .helptext{
            display:none;
        }

        ul{
            display:none;
        }

    </style>

</head>

<body>

<div class="register-box">

    <h2>Create Account</h2>

 <form method="POST">

    {% csrf_token %}

    {{ form.errors }}

    <h3>Username</h3>
    {{ form.username }}

    <h3>Password</h3>
    {{ form.password1 }}

    <h3>Confirm Password</h3>
    {{ form.password2 }}

    <button type="submit">
        Register
    </button>

</form>

</div>

</body>
</html>
