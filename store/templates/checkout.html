{% load static %}

<!DOCTYPE html>

<html>
<head>
    <title>Checkout - TechVerse</title>

```
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<style>

    body{
        background:#0f172a;
        color:white;
        font-family:Arial, sans-serif;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
    }

    .checkout-container{
        background:#1e293b;
        width:500px;
        padding:40px;
        border-radius:20px;
        box-shadow:0px 0px 25px rgba(0,255,204,0.2);
    }

    h1{
        text-align:center;
        color:#00ffcc;
        margin-bottom:30px;
    }

    label{
        font-weight:bold;
    }

    input[type="text"],
    textarea{
        width:100%;
        padding:12px;
        margin-top:8px;
        margin-bottom:20px;
        border:none;
        border-radius:10px;
        background:#334155;
        color:white;
    }

    textarea{
        resize:none;
    }

    .payment-box{
        margin:20px 0;
    }

    .place-order{
        width:100%;
        background:#00ffcc;
        color:black;
        border:none;
        padding:15px;
        border-radius:10px;
        font-size:18px;
        font-weight:bold;
        cursor:pointer;
    }

    .place-order:hover{
        transform:scale(1.03);
    }

    .back-link{
        display:block;
        text-align:center;
        margin-top:20px;
        color:#00ffcc;
        text-decoration:none;
    }

</style>
```

</head>

<body>

<div class="checkout-container">

```
<h1>🛒 Checkout</h1>

<form action="{% url 'order_success' %}" method="POST">

    {% csrf_token %}

  <label style="color: white;">Full Name</label>
<input type="text" name="name" required>

<label style="color: white;">Phone Number</label>
<input type="text" name="phone" required>

<label style="color: white;">Address</label>
<textarea name="address" rows="4" required></textarea>

    <div class="payment-box">

        <label>Payment Method</label>

        <p>
            <input type="radio" name="payment" value="COD" required>
            Cash on Delivery
        </p>

        <p>
            <input type="radio" name="payment" value="UPI">
            UPI
        </p>

        <p>
            <input type="radio" name="payment" value="Card">
            Card
        </p>

    </div>

    <button class="place-order" type="submit">
        Place Order
    </button>

</form>

<a href="/cart/" class="back-link">
    ← Back To Cart
</a>
```

</div>

</body>
</html>
